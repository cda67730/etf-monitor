name: debug tpex
on:
  push:
    branches: [debug-report]
    paths: ['debug/tpex_test.py', '.github/workflows/debug-tpex.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python debug/tpex_test.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add debug/tpex_result.txt && git commit -m "tpex result" && git push
