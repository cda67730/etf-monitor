name: 三大法人同買日報

on:
  schedule:
    - cron: '20 10 * * 1-5'   # 台灣時間平日 18:20（證交所、櫃買資料公布後）
  workflow_dispatch:
    inputs:
      backfill:
        description: '往回補幾個交易日'
        default: '60'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inst-cobuy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: inst_cobuy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: inst_cobuy/requirements.txt
      - run: pip install -r requirements.txt
      - name: 抓三大法人資料
        run: python fetch.py ${{ github.event.inputs.backfill || '60' }}
      - name: 計算並產生網頁
        run: python build.py
      - name: 存回每日資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "inst_cobuy: 更新三大法人資料 $(TZ=Asia/Taipei date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: inst_cobuy/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
