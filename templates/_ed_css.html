{# 看盤風格共用樣式：ETF 日報、三大法人同買共用 #}
<style>body { background: #eef1f5; } @media (max-width: 1199.98px) { .container { max-width: 100%; } }</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 看盤風格：深色行情列＋白色面板，台股慣例紅漲綠跌，數字等寬靠右 */
  .ed, .ed-dlg {
    --bg: #eef1f5; --panel: #ffffff; --term: #0f1b2d; --term2: #16263d; --term-line: #24364f; --term-text: #c9d4e3;
    --ink: #0f1b2d; --body: #334155; --mute: #6b7a8f; --rule: #e3e8ef; --zebra: #f8fafc; --hover: #eef4fb;
    --accent: #f5a623; --steel: #2b6cb0;
    --up: #e5383b; --up-t: #fde8e8; --down: #12a150; --down-t: #e3f6eb;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --num: "IBM Plex Sans", "Roboto", "Noto Sans TC", sans-serif;
    font-family: var(--sans); color: var(--body);
  }
  .ed { max-width: 1080px; margin: -8px auto 64px; }
  .ed .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

  /* 行情列 */
  .term { background: var(--term); color: var(--term-text); border-radius: 10px; padding: 14px 20px; }
  .term-top { display: flex; justify-content: space-between; align-items: center; gap: 10px 20px; flex-wrap: wrap; }
  .term h1 { font-weight: 700; font-size: 1.5rem; color: #fff; margin: 0; letter-spacing: .02em; }
  .stat { display: flex; flex-wrap: wrap; gap: 2px 0; font-size: .8rem; color: #8ea0b8; margin-top: 4px; }
  .stat > span { white-space: nowrap; }
  .stat > span + span::before { content: "·"; margin: 0 8px; color: #4a5d78; }
  .stat b { font-family: var(--num); font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
  .stat b.ok { color: #4ade80; } .stat b.bad { color: #ff6b6b; }
  .miss-btn { border: 0; background: none; color: var(--accent); font-size: .8rem; padding: 0 0 0 6px; cursor: pointer; }
  .miss-btn:focus-visible { outline: 1px solid var(--accent); }
  .miss-list { margin-top: 8px; font-size: .8rem; color: var(--term-text); }
  .term-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-pdf { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: .9rem; font-weight: 600;
             color: #fff; background: var(--term2); border: 1px solid var(--term-line); text-decoration: none; white-space: nowrap; }
  .btn-pdf i { color: var(--accent); }
  .btn-pdf:hover { background: var(--term-line); color: #fff; }
  .btn-pdf:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* 報告下載：日期下拉＋按鈕 */
  .dl { display: inline-flex; align-items: stretch; }
  .dl-sel { border: 1px solid var(--term-line); border-right: 0; border-radius: 8px 0 0 8px; background: var(--term2); color: #fff;
            font-family: var(--num); font-size: .88rem; padding: 0 6px 0 10px; cursor: pointer; }
  .dl-sel:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  .dl .btn-pdf { border-radius: 0 8px 8px 0; }
  .tabs { display: inline-flex; background: var(--term2); border: 1px solid var(--term-line); border-radius: 8px; padding: 3px; gap: 3px; }
  .tabs a { padding: 6px 20px; font-size: .92rem; color: var(--term-text); text-decoration: none; white-space: nowrap; border-radius: 6px; }
  .tabs a.on { background: var(--accent); color: #1a1205; font-weight: 700; }
  .tabs a:not(.on):hover { background: var(--term-line); color: #fff; }
  .tabs a:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  @media (max-width: 640px) {
    .term { border-radius: 0; margin: 0 -12px; padding: 12px 16px; }
    .term h1 { font-size: 1.3rem; }
  }

  /* 區塊導覽（橫向、捲動時貼頂） */
  .secnav { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
            margin-top: 12px; padding: 6px; background: rgba(255, 255, 255, .94); backdrop-filter: blur(6px);
            border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 2px 8px rgba(15, 27, 45, .06); }
  .secnav::-webkit-scrollbar { display: none; }
  .secnav a { flex: 0 0 auto; padding: 6px 14px; border-radius: 6px; font-size: .88rem; color: var(--body); text-decoration: none; white-space: nowrap; }
  .secnav a:hover { background: var(--hover); color: var(--ink); }
  .secnav a.on { background: var(--term); color: #fff; font-weight: 600; }
  .secnav a:focus-visible { outline: 2px solid var(--steel); outline-offset: 1px; }
  .sec { scroll-margin-top: 64px; }
  @media (max-width: 640px) { .secnav { margin: 0 -12px; border-radius: 0; border-width: 0 0 1px; } }

  /* 面板 */
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 0 18px 16px; margin-top: 16px;
           box-shadow: 0 1px 2px rgba(15, 27, 45, .04); }
  @media (max-width: 640px) { .panel { padding: 0 12px 12px; border-radius: 8px; } }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
              padding: 14px 0 10px; border-bottom: 1px solid var(--rule); }
  .ed h2 { font-size: 1.12rem; font-weight: 700; color: var(--ink); margin: 0; display: flex; align-items: center; gap: 8px; }
  .ed h2::before { content: ""; width: 4px; height: 1.05em; background: var(--accent); border-radius: 2px; }
  .sec-head .sub { font-size: .8rem; color: var(--mute); margin-top: 3px; padding-left: 12px; }
  .btn-ed { border: 1px solid var(--steel); background: var(--steel); color: #fff; font-size: .86rem; font-weight: 600; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .btn-ed:hover { background: #22578f; }
  .btn-ed.ghost { background: #fff; color: var(--steel); }
  .btn-ed:focus-visible, .sel:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
  .sel { border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; font-size: .88rem; color: var(--ink);
         background: #fff; font-family: var(--num); }
  .dlg-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .84rem; color: var(--mute); }

  /* 增減排行 */
  .ranks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
  .rank h3 { font-size: .92rem; font-weight: 700; margin: 12px 0 4px; display: flex; align-items: center; gap: 8px; color: var(--c); }
  .rank h3 .bar { width: 8px; height: 8px; background: var(--c); border-radius: 50%; }
  .rank.buy { --c: var(--up); --t: var(--up-t); } .rank.sell { --c: var(--down); --t: var(--down-t); }
  .rank ol { list-style: none; padding: 0; margin: 0; }
  .rank li { position: relative; isolation: isolate; display: grid; grid-template-columns: 1.7em minmax(0, 1fr) auto; gap: 1px 10px;
             align-items: center; padding: 7px 8px 7px 4px; border-bottom: 1px solid #f1f4f8; }
  .rank li::before { content: ""; position: absolute; z-index: -1; right: 0; top: 4px; bottom: 4px; width: var(--w, 0%);
                     background: var(--t); border-radius: 3px; }
  .rank .no { font-family: var(--num); color: var(--mute); font-size: .78rem; text-align: center; }
  .rank li.top .no { color: #fff; background: var(--c); border-radius: 4px; height: 1.5em; line-height: 1.5em; font-weight: 700; }
  .rank .stk { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .stk b { font-weight: 500; font-size: 1.02rem; color: var(--ink); } .rank .stk .code { font-family: var(--num); color: var(--mute); font-size: .8rem; margin-left: 6px; }
  .rank .meta { grid-column: 2 / -1; font-size: .74rem; color: var(--mute); }
  .rank .amt { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--c); text-align: right; white-space: nowrap; }
  .rank .amt small { font-weight: 400; color: var(--mute); margin-left: 2px; font-size: .75rem; }
  .rank li.click { cursor: pointer; } .rank li.click:hover, .rank li.open { background: var(--hover); }
  .rank li.click:focus-visible { outline: 2px solid var(--steel); outline-offset: -2px; }
  .rank .stk b::after { content: "\f201"; font-family: "Font Awesome 6 Free"; font-weight: 900; font-size: .72rem; color: var(--steel); margin-left: 6px; opacity: .55; }
  .rank li.trend-li { display: block; padding: 6px 0 10px; border-bottom: 1px solid #f1f4f8; }
  .rank li.trend-li::before { display: none; }
  .rank li.trend-li .trend-cv { height: 220px; }
  .rank-switch { display: none; }
  /* 依排行區塊本身的寬度決定：夠寬就並列，太窄才改成切換 */
  #rank { container-type: inline-size; container-name: rank; }
  @container rank (max-width: 559.98px) {
    .ranks { grid-template-columns: 1fr; }
    .rank-switch { display: inline-flex; margin-top: 12px; border: 1px solid var(--rule); border-radius: 8px; padding: 3px; gap: 3px; background: var(--bg); }
    .rank-switch button { border: 0; background: transparent; padding: 5px 16px; font-size: .88rem; color: var(--body); border-radius: 6px; }
    .rank-switch button[data-show="buy"].on { background: var(--up); color: #fff; font-weight: 700; }
    .rank-switch button[data-show="sell"].on { background: var(--down); color: #fff; font-weight: 700; }
    .ranks[data-show="buy"] .rank.sell, .ranks[data-show="sell"] .rank.buy { display: none; }
    .ranks .rank h3 { display: none; }
  }
  @container rank (min-width: 560px) and (max-width: 760px) {
    .ranks { gap: 0 16px; }
    .rank .meta { font-size: .7rem; }
    .rank li { grid-template-columns: 1.5em minmax(0, 1fr) auto; gap: 1px 6px; }
  }
  .empty { color: var(--mute); font-size: .9rem; padding: 16px 0; }

  /* 表格 */
  .tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .tbl th { font-size: .74rem; color: var(--mute); font-weight: 600; text-align: right; padding: 9px 8px; background: var(--zebra);
            border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .tbl td { padding: 8px 8px; border-bottom: 1px solid #f1f4f8; text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--ink); }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl tbody tr:nth-child(even) td { background: #fbfcfe; }
  .tbl td.name { font-family: var(--sans); }
  /* 股名：Noto Sans TC 只載入 400／500／700，600 會變成 700 太粗，所以用 500 並放大 */
  .tbl td.name b { font-weight: 500; font-size: 1.04rem; letter-spacing: .02em; } .tbl td.name .code { color: var(--mute); font-size: .78rem; margin-left: 6px; font-family: var(--num); }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--hover); }
  .tbl tr.click:focus-visible td { outline: none; background: var(--hover); }
  .up, .tbl td.up { color: var(--up); } .down, .tbl td.down { color: var(--down); } .muted, .tbl td.muted { color: var(--mute); }
  .pill { display: inline-block; min-width: 4.8em; text-align: right; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .pill.up { background: var(--up-t); color: var(--up); } .pill.down { background: var(--down-t); color: var(--down); }
  .pill.flat { background: var(--zebra); color: var(--mute); }
  .etfn { display: inline-block; min-width: 2.2em; text-align: center; padding: 1px 6px; border-radius: 4px; font-weight: 700;
          color: #fff; background: rgba(43, 108, 176, var(--a, .5)); }
  .chip { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 4px; background: var(--zebra); color: var(--body); font-family: var(--sans); font-weight: 600; }
  .chip.NEW, .chip.INCREASED { background: var(--up-t); color: var(--up); }
  .chip.DECREASED, .chip.REMOVED { background: var(--down-t); color: var(--down); }
  @media (max-width: 640px) {
    .tbl thead { display: none; }
    .tbl, .tbl tbody { display: block; }
    .tbl tr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 9px 2px; border-bottom: 1px solid #f1f4f8; }
    .tbl tbody tr:nth-child(even) td { background: transparent; }
    .tbl td { border: 0; padding: 0; text-align: left; }
    .tbl td.name { flex: 1 1 100%; }
    .tbl td[data-l]::before { content: attr(data-l) " "; font-family: var(--sans); font-size: .72rem; color: var(--mute); }
    .tbl td.m-hide { display: none; }
    .pill { min-width: 0; }
    .tbl tr.trend { display: block; padding: 0 0 10px; }
    .tbl tr.trend > td { display: block; padding: 0 !important; }
    .trend-cv { height: 220px; }
    .tbl tr { position: relative; }
    .tbl tr td.act { position: absolute; right: 0; top: 7px; width: auto; }
    .tbl tr:has(td.act) td.name { padding-right: 76px; }
    .etf-chips { justify-content: flex-start; flex: 1 1 100%; }
    .net { margin-left: 4px; min-width: 0; }
  }
  .more { margin-top: 12px; }
  /* 排序鈕 */
  .tbl th button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; white-space: nowrap; }
  .tbl th button.sort:hover, .tbl th button.sort.on { color: var(--ink); }
  button.sort i { margin-left: 5px; font-size: .9em; opacity: .45; }
  button.sort.on i { opacity: 1; color: var(--steel); }
  button.sort:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; border-radius: 3px; }
  .sort-m { display: none; }
  @media (max-width: 640px) {
    .sort-m { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 0 4px; font-size: .78rem; color: var(--mute); }
    .sort-m button.sort { border: 1px solid var(--rule); background: #fff; border-radius: 6px; padding: 4px 9px; font-size: .8rem; color: var(--body); }
    .sort-m button.sort.on { border-color: var(--steel); color: var(--steel); font-weight: 600; }
  }
  /* 合計持股的增減箭頭 */
  .net { display: inline-block; min-width: 5.6em; margin-left: 8px; font-size: .8rem; font-weight: 600; }
  .net.up::before { content: "▲ "; font-size: .72em; } .net.down::before { content: "▼ "; font-size: .72em; }
  /* 跨 ETF 點開的趨勢圖 */
  #cross tr.click td:first-child b::after { content: "\f201"; font-family: "Font Awesome 6 Free"; font-weight: 900; font-size: .72rem;
                                            color: var(--steel); margin-left: 6px; opacity: .55; }
  #cross tr.open td { background: var(--hover) !important; }
  tr.trend > td { padding: 4px 8px 14px !important; background: #fff !important; text-align: left; }
  .trend-box { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px 8px; }
  .trend-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--mute); margin-bottom: 6px; }
  .trend-head b { color: var(--ink); font-family: var(--sans); }
  .trend-cv { position: relative; height: 240px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; }
  .lg i { display: inline-block; width: 12px; height: 3px; background: var(--steel); }
  .lg i.bar { height: 9px; width: 6px; background: linear-gradient(90deg, var(--up) 50%, var(--down) 50%); }
  /* 首次買進 */
  .etf-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .ec { display: inline-flex; gap: 5px; align-items: baseline; font-size: .76rem; padding: 2px 7px; border-radius: 4px; background: #eef4fb; color: var(--steel); white-space: nowrap; }
  .ec b { font-weight: 600; } .ec span { color: var(--ink); }
  .fresh { display: inline-block; font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-left: 6px;
           background: var(--accent); color: #1a1205; font-family: var(--sans); vertical-align: 1px; }
  /* 列內的明細按鈕 */
  .ico { border: 1px solid var(--rule); background: #fff; color: var(--steel); border-radius: 6px; padding: 3px 9px; font-size: .78rem;
         cursor: pointer; white-space: nowrap; font-family: var(--sans); }
  .ico:hover { background: var(--steel); border-color: var(--steel); color: #fff; }
  .ico:focus-visible { outline: 2px solid var(--steel); outline-offset: 1px; }
  .ico i { margin-right: 4px; }
  .tbl td.act { width: 1%; }
  .loading { color: var(--mute); font-size: .9rem; padding: 18px 0; }

  /* 看詳細面板 */
  .ed-dlg { border: 0; padding: 0; width: min(980px, 96vw); max-width: 96vw; max-height: 90vh; border-radius: 10px;
            box-shadow: 0 24px 64px rgba(15, 27, 45, .4); }
  .ed-dlg::backdrop { background: rgba(15, 27, 45, .6); }
  .dlg-head { position: sticky; top: 0; z-index: 2; background: var(--term); color: var(--term-text); padding: 14px 18px 12px; }
  .dlg-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .dlg-top h4 { font-weight: 700; font-size: 1.08rem; color: #fff; margin: 0; }
  .dlg-x { border: 0; background: none; font-size: 1.7rem; line-height: 1; color: #8ea0b8; cursor: pointer; padding: 0 4px; }
  .dlg-x:hover { color: #fff; }
  .dlg-head .dlg-ctl { margin-top: 10px; color: #8ea0b8; }
  .dlg-head .sel { background: var(--term2); color: #fff; border-color: var(--term-line); }
  .dlg-sum { font-size: .8rem; color: #8ea0b8; margin-top: 8px; }
  .dlg-body { padding: 4px 18px 18px; overflow: auto; }
  @media (max-width: 640px) { .ed-dlg { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; border-radius: 0; margin: 0; } }
  @media (prefers-reduced-motion: no-preference) { .tabs a, .btn-ed, .tbl td { transition: background-color .12s, color .12s; } }
</style>
