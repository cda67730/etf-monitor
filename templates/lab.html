{% extends "base.html" %}

{% block title %}量化研究 - Danny大叔的股市觀測筆記{% endblock %}

{% block content %}
{% include "_ed_css.html" %}
<style>
  .lab .secnav button[data-k] { flex: 0 0 auto; border: 0; background: none; padding: 6px 14px; border-radius: 6px; font-size: .88rem; color: var(--body); white-space: nowrap; cursor: pointer; }
  .lab .secnav button[data-k]:hover { background: var(--hover); color: var(--ink); }
  .lab .secnav button[data-k].on { background: var(--term); color: #fff; font-weight: 600; }
  .lab .secnav button[data-k]:focus-visible { outline: 2px solid var(--steel); outline-offset: 1px; }
  .lab .secnav .n { font-family: var(--num); font-size: .74rem; opacity: .7; margin-left: 4px; }
  .lab .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lab .dl-sel { border-radius: 8px; border-right: 1px solid var(--term-line); padding: 6px 10px; }
  .lab .note { font-size: .86rem; color: var(--body); margin: 10px 0 0; line-height: 1.7; white-space: pre-wrap; }
  .lab .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* 欄寬依內容，不撐滿整個版面；文字欄太長就截斷（滑鼠移上去看全文） */
  .lab .wrap .tbl { width: auto; min-width: 0; }
  .lab .tbl td, .lab .tbl th { white-space: nowrap; padding-left: 10px; padding-right: 10px; }
  .lab .tbl td.t { max-width: 16em; overflow: hidden; text-overflow: ellipsis; }
  .lab .tbl td.t { text-align: left; }
  .lab .tbl th.t { text-align: left; }
  /* 手機也維持表格，可左右滑動 */
  @media (max-width: 640px) {
    .lab .tbl { display: table; font-size: .8rem; }
    .lab .tbl thead { display: table-header-group; } .lab .tbl tbody { display: table-row-group; }
    .lab .tbl tr { display: table-row; padding: 0; }
    .lab .tbl th, .lab .tbl td { display: table-cell; padding: 6px 8px; border-bottom: 1px solid #f1f4f8; }
    .lab .tbl td[data-l]::before { content: none; }
    .lab .sort-m { display: none; }
  }
  .lab .tbl tr.f-stopped td { background: rgba(229, 57, 53, .12); }
  .lab .tbl tr.f-market_block td { background: rgba(128, 128, 128, .12); }
  .lab .tbl tr.f-inst_both td { background: rgba(46, 204, 113, .12); }
  .lab .tbl tr.old td { background: rgba(241, 196, 15, .18); }                     /* 營收月份不是最新 */
  .lab .tbl tr.f-inst_both.old td { background: rgba(46, 204, 113, .12); }
  .lab .tbl tr.f-inst_both.old td:first-child { background: rgba(241, 196, 15, .35); }
  .lab .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 8px; font-size: .82rem; color: var(--body); }
  .lab .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lab .legend i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); background: #fff; }
  .lab .legend i.f-stopped { background: rgba(229, 57, 53, .12); }
  .lab .legend i.f-market_block { background: rgba(128, 128, 128, .12); }
  .lab .legend i.f-inst_both { background: rgba(46, 204, 113, .12); }
  .lab .legend i.old { background: rgba(241, 196, 15, .18); }
  .lab .help { margin: 0 0 10px; font-size: .84rem; color: var(--body); }
  .lab .help summary { cursor: pointer; color: var(--ink); font-weight: 600; width: fit-content; }
  .lab .help summary:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
  .lab .help-body { margin-top: 6px; padding: 10px 12px; background: #f8fafc; border-radius: 8px; line-height: 1.7; }
  .lab .help-body p { margin: 0 0 8px; white-space: pre-wrap; } .lab .help-body p:last-child { margin-bottom: 0; }
  .lab .tbl td.bad, .lab .tbl td.bad span { color: #e67e22 !important; font-weight: 700; }
  .lab .tbl .info { font-size: .72rem; opacity: .6; margin-left: 2px; font-style: normal; }
  /* 表格欄位多：量化研究頁放寬到接近整個視窗（超出外層 container） */
  .lab.ed { --w: min(1760px, calc(100vw - 40px)); width: var(--w); max-width: none; margin-left: calc((100% - var(--w)) / 2); margin-right: 0; }
  @media (max-width: 640px) { .lab.ed { --w: 100%; } }
  .lab .tbl .ck { color: #d6336c; font-weight: 700; }
  .lab .meta { font-size: .78rem; color: var(--mute); margin-top: 10px; }
</style>

<article class="ed lab">
  <header class="term">
    <div class="term-top">
      <div>
        <h1>量化研究</h1>
        <div class="stat" id="stat"><span>本機 breakout_detector 每日結果（僅登入可見）</span></div>
      </div>
      <div class="ctl">
        <select class="dl-sel" id="date" aria-label="資料日"></select>
      </div>
    </div>
  </header>

  <nav class="secnav" id="labtabs" role="tablist" aria-label="結果">
    {% for k, v in kinds.items() %}<button type="button" role="tab" data-k="{{ k }}"{% if k == start %} class="on" aria-selected="true"{% endif %}>{{ v }}{% if summary[k] and summary[k].date %}<span class="n">{{ summary[k].date[5:].replace('-', '/') }}</span>{% endif %}</button>{% endfor %}
  </nav>

  <section class="panel">
    <div class="sec-head"><div><h2 id="h2">—</h2><div class="sub" id="sub"></div></div></div>
    <p class="note" id="note" hidden></p>
    <div class="legend" id="legend" hidden></div>
    <details class="help" id="help" hidden><summary id="help-title">分數怎麼看</summary><div class="help-body" id="help-body"></div></details>
    <div class="wrap" id="box"><div class="loading">載入中…</div></div>
    <div class="meta" id="meta"></div>
  </section>
</article>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let kind = {{ start|tojson }}, DATA = null, sortK = null, sortD = -1;
  const isNum = v => typeof v === 'number' && isFinite(v);
  // 網站端的顯示調整（依欄位標題比對，推送內容不用改）：慢牛隱藏「第N天」「進場日」，「標記」改短字，滑鼠移上去看原文
  const SHORT_FLAG = t => /停損/.test(t) ? '停損' : /未成交/.test(t) ? '未成交' : /掛單/.test(t) ? '掛單中'
    : /季線/.test(t) ? '季空不買' : /大盤|年線|月線/.test(t) ? '大盤不買' : /持有/.test(t) ? '持有' : t;
  const VIEW = {
    slow_bull: { hide: ['第N天', '進場日'], short: { '標記': SHORT_FLAG },
                 after: { anchor: '報酬', match: /分$|分數/ } },        // 標題以「分」結尾的分數欄放到報酬後面
    // 營收創新高：拿掉市場、營收月份；法人四欄移到創新高月數後面；月營收放最後；營收月份不是最新月的列標黃底
    revenue_high: { hide: ['市場', '營收月份'], after: { anchor: '創新高月數', match: /外資|投信|自營|法人/ },
                    last: /^月營收/, oldMonth: '營收月份' },
  };
  function cell(V, c, v) {
    const f = (V.short || {})[c.label];
    if (f && typeof v === 'string' && f(v) !== v) return `<span title="${esc(v)}">${esc(f(v))}</span>`;
    if (typeof v === 'string' && v.length > 14 && !/^\d{4}-\d{2}/.test(v)) return `<span title="${esc(v)}">${esc(v)}</span>`;
    return fmt(v, c.type);
  }
  const HELP_TITLE = { slow_bull: '分數怎麼看', backtest: '分數怎麼看', ae_monitor: '分數怎麼看' };
  const THIS_YEAR = String(new Date().getFullYear());
  function fmt(v, t) {
    if (t === 'check' || typeof v === 'boolean')                                   // 是／否：✓ 或 —
      return v === true || v === 1 ? '<span class="ck" title="是">✓</span>' : '<span class="muted">—</span>';
    if (v == null || v === '') return '<span class="muted">—</span>';
    const mm = typeof v === 'string' && v.match(/^(\d{4})-(\d{2})$/);             // 年月：9月（不是今年加年）
    if (mm) return `<span title="${esc(v)}">${mm[1] === THIS_YEAR ? '' : mm[1].slice(2) + '年'}${+mm[2]}月</span>`;
    const dm = typeof v === 'string' && v.match(/^(\d{4})-(\d{2})-(\d{2})/);       // 日期縮短：10/14（不是今年才加年）
    if (dm) return `<span title="${esc(v)}">${dm[1] === THIS_YEAR ? '' : dm[1].slice(2) + '/'}${dm[2]}/${dm[3]}</span>`;
    if (!isNum(v)) return esc(v);
    if (t === 'pct') return `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${(v > 0 ? '+' : '') + v.toFixed(2)}%</span>`;
    if (t === 'signed') return `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${(v > 0 ? '+' : '') + v.toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>`;
    if (t === 'int') return Math.round(v).toLocaleString('en-US');
    if (t === 'float') return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return v.toLocaleString('en-US', { maximumFractionDigits: Math.abs(v) < 10 ? 4 : 2 });
  }
  const lim = x => typeof x === 'number' && isFinite(x);
  const bad = (c, v) => isNum(v) && ((lim(c.bad_below) && v < c.bad_below) || (lim(c.bad_above) && v > c.bad_above));   // 只標該格
  const left = c => c.type === 'text' || c.type === 'code' || c.type === 'date' || (!c.type && DATA.rows.some(r => r[c.key] != null && !isNum(r[c.key])));
  function render() {
    if (!DATA) return;
    const V = VIEW[kind] || {};
    let C = (DATA.columns || []).filter(c => !String(c.key).startsWith('_') && !(V.hide || []).includes(c.label));
    if (V.after) {                                   // 把分數欄移到指定欄（例如「報酬」）後面
      const mv = C.filter(c => V.after.match.test(c.label)), rest = C.filter(c => !V.after.match.test(c.label));
      const i = rest.findIndex(c => c.label === V.after.anchor);
      if (mv.length && i >= 0) C = [...rest.slice(0, i + 1), ...mv, ...rest.slice(i + 1)];
    }
    if (V.last) C = [...C.filter(c => !V.last.test(c.label)), ...C.filter(c => V.last.test(c.label))];
    // 最新月份＝這份資料裡最大的月份；比它舊的列加 old（欄位就算隱藏也照樣判斷）
    const mc = V.oldMonth && (DATA.columns || []).find(c => c.label === V.oldMonth);
    const months = mc ? DATA.rows.map(r => r[mc.key]).filter(v => typeof v === 'string' && v) : [];
    const newest = months.length ? months.reduce((a, b) => (b > a ? b : a)) : null;
    const isOld = r => newest && typeof r[mc.key] === 'string' && r[mc.key] && r[mc.key] < newest;
    const rows = [...DATA.rows];
    const FLAGS = new Set(['stopped', 'market_block', 'inst_both']);   // 這幾種上色；new／holding、未知值、缺值都照一般列
    const rowCls = r => { const k = [FLAGS.has(r._flag) ? 'f-' + r._flag : '', isOld(r) ? 'old' : ''].filter(Boolean).join(' ');
                          return k ? ` class="${k}"${isOld(r) ? ` title="營收月份 ${esc(r[mc.key])}，不是最新的 ${esc(newest)}"` : ''}` : ''; };
    const lg = DATA.legend && typeof DATA.legend === 'object' ? Object.entries(DATA.legend) : [];
    const nOld = DATA.rows.filter(isOld).length;
    if (nOld) lg.push(['old', `營收月份不是最新（${+newest.slice(5, 7)}月）的 ${nOld} 檔`]);
    $('#legend').hidden = !lg.length;
    const hp = typeof DATA.help === 'string' ? DATA.help.trim() : '';     // 純文字：跳脫後以空白行分段
    $('#help').hidden = !hp;
    $('#help-title').textContent = HELP_TITLE[kind] || '這份清單怎麼看';
    $('#help-body').innerHTML = hp ? hp.split(/\n\s*\n/).map(t => `<p>${esc(t.trim())}</p>`).join('') : '';
    $('#legend').innerHTML = lg.map(([k, v]) => `<span><i class="${FLAGS.has(k) ? 'f-' + k : k === 'old' ? 'old' : ''}"></i>${esc(v)}</span>`).join('');
    if (sortK) rows.sort((a, b) => {
      const x = a[sortK], y = b[sortK];
      if (x == null) return 1; if (y == null) return -1;
      return (isNum(x) && isNum(y) ? x - y : String(x).localeCompare(String(y), 'zh-Hant')) * sortD;
    });
    $('#h2').textContent = DATA.name;
    $('#sub').textContent = `資料日 ${DATA.date}・${DATA.rows.length} 筆`;
    $('#note').hidden = !DATA.note; $('#note').textContent = DATA.note || '';
    $('#meta').textContent = `本站收到時間 ${DATA.received}`;
    if (!rows.length) { $('#box').innerHTML = '<div class="empty">這一天沒有結果。</div>'; return; }
    const L = Object.fromEntries(C.map(c => [c.key, left(c)]));
    $('#box').innerHTML = `<table class="tbl"><thead><tr>${C.map(c => `<th class="${L[c.key] ? 't' : ''}"${sortK === c.key ? ` aria-sort="${sortD < 0 ? 'descending' : 'ascending'}"` : ''}><button type="button" class="sort${sortK === c.key ? ' on' : ''}" data-k="${esc(c.key)}"${c.desc ? ` title="${esc(c.desc)}" aria-description="${esc(c.desc)}"` : ''}>${esc(c.label)}${c.desc ? '<em class="info" aria-hidden="true">ⓘ</em>' : ''}<i class="fas ${sortK !== c.key ? 'fa-sort' : sortD < 0 ? 'fa-sort-down' : 'fa-sort-up'}"></i></button></th>`).join('')}</tr></thead><tbody>${
      rows.map(r => `<tr${rowCls(r)}>${C.map(c => `<td class="${L[c.key] ? 't' : ''}${bad(c, r[c.key]) ? ' bad' : ''}">${cell(V, c, r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    $('#box').querySelectorAll('button.sort').forEach(b => b.onclick = () => {
      const k = b.dataset.k; sortD = sortK === k ? -sortD : -1; sortK = k; render();
    });
  }
  async function load(date) {
    $('#box').innerHTML = '<div class="loading">載入中…</div>';
    try {
      const r = await fetch(`/api/lab/${kind}` + (date ? `?date=${date}` : ''), { cache: 'no-store' });
      if (r.status === 401) { location.href = '/login?next=/lab'; return; }
      if (r.status === 404) { DATA = null; $('#h2').textContent = $('#labtabs button[data-k].on').firstChild.textContent; $('#sub').textContent = ''; $('#note').hidden = true; $('#legend').hidden = true; $('#help').hidden = true; $('#meta').textContent = '';
        $('#box').innerHTML = '<div class="empty">還沒收到這項結果。本機推送後就會出現。</div>'; return; }
      DATA = await r.json(); sortK = null; sortD = -1; render();
    } catch (e) { $('#box').innerHTML = '<div class="empty">讀取失敗，請稍後再試。</div>'; }
  }
  async function loadDates() {
    try {
      const r = await fetch(`/api/lab/${kind}/dates`, { cache: 'no-store' });
      const ds = r.ok ? await r.json() : [];
      $('#date').innerHTML = ds.map(x => `<option value="${x.date}">${x.date}</option>`).join('') || '<option value="">—</option>';
    } catch (e) { $('#date').innerHTML = '<option value="">—</option>'; }
    await load($('#date').value);
  }
  const TABS = document.querySelectorAll('#labtabs button[data-k]');
  TABS.forEach(b => b.onclick = () => {
    TABS.forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    kind = b.dataset.k; loadDates();
  });
  $('#date').onchange = e => load(e.target.value);
  loadDates();
})();
</script>
{% endblock %}
